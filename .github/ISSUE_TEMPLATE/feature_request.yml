name: Feature request
description: Propose a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user need does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be built? Include routes/states affected.
    validations:
      required: true
  - type: textarea
    id: product
    attributes:
      label: Product impact
      description: Does it change docs/product/DECISIONES.md, the 9-state pipeline, or the LeadRepository contract? If so, how?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
