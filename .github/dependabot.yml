# Opens update PRs only. Nothing here merges them.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2.17.6+ depende de htmlparser2 ESM-only. require() falla en Vercel
      # y Correo / el webhook inbound responden 500 con cuerpo vacío.
      # No subir de 2.17.5 hasta que el runtime cargue ese require
      # o htmlparser2 vuelva a publicar un build CommonJS.
      - dependency-name: "sanitize-html"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
