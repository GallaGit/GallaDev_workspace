name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, "feat/**", "feature/**"]
  pull_request:
    branches: [master, main]

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  component:
    name: Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:component

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit, component]
    env:
      # NEXT_PUBLIC_* deben existir en el build para el cliente browser.
      SUPABASE_URL: "https://rafgpbiiwofrqmfpqrij.supabase.co"
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_0y6b9TMvbTpD96Eo2O1iEQ_DNIv9DV9"
      NEXT_PUBLIC_SUPABASE_URL: "https://rafgpbiiwofrqmfpqrij.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_0y6b9TMvbTpD96Eo2O1iEQ_DNIv9DV9"
      AUTH_DISABLED: "false"
      PORT: "3000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # Vacío si el secret no existe: critical-paths omite el login smoke.
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          # El servidor de Playwright fuerza estos valores; aquí quedan explícitos.
          DEMO_MODE_ENABLED: "true"
          DEMO_SESSION_SECRET: "e2e-visitor-demo-secret"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
