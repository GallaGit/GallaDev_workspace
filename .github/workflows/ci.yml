name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, "feat/**", "feature/**"]
  pull_request:
    branches: [master, main]

# El token del workflow solo lee el repo. El job de E2E sube el informe.
permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  component:
    name: Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:component

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit, component]
    permissions:
      contents: read
      actions: write
    env:
      AUTH_DISABLED: "false"
      PORT: "3000"
      # Usuarios fake solo para el Supabase local del job. No son secretos.
      E2E_ADMIN_EMAIL: admin@e2e.test
      E2E_ADMIN_PASSWORD: e2e-admin-pass-1
      E2E_SELLER_EMAIL: seller@e2e.test
      E2E_SELLER_PASSWORD: e2e-seller-pass-1
      E2E_VIEWER_EMAIL: viewer@e2e.test
      E2E_VIEWER_PASSWORD: e2e-viewer-pass-1
      E2E_TEST_EMAIL: admin@e2e.test
      E2E_TEST_PASSWORD: e2e-admin-pass-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (migraciones de supabase/migrations)
        run: |
          supabase start -x realtime,storage-api,imgproxy,edge-runtime,studio,mailpit,logflare,vector,supavisor,postgres-meta
          supabase status -o env > /tmp/supabase.env
          get() { grep "^$1=" /tmp/supabase.env | cut -d= -f2- | tr -d '"'; }
          URL="$(get API_URL)"; ANON="$(get ANON_KEY)"; SERVICE="$(get SERVICE_ROLE_KEY)"
          for v in "$URL" "$ANON" "$SERVICE"; do [ -n "$v" ] || { echo "supabase status incompleto"; exit 1; }; done
          echo "::add-mask::$ANON"
          echo "::add-mask::$SERVICE"
          {
            echo "SUPABASE_URL=$URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
          } >> "$GITHUB_ENV"
      - name: Sembrar usuarios y leads fake
        run: node scripts/e2e-seed.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # El servidor de Playwright usa el secret si existe (>= 16). Si no, genera uno.
          DEMO_MODE_ENABLED: "true"
          DEMO_SESSION_SECRET: ${{ secrets.E2E_DEMO_SESSION_SECRET }}
      - if: always()
        run: supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
